<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Gatherly helps plan weddings, birthdays and community events with budgets, timelines, vendors and AI ideas."><title>Gatherly — Make room for the celebration</title><link rel="stylesheet" href="style.css"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23315a49'/%3E%3Ctext x='32' y='47' text-anchor='middle' font-size='48' fill='%23e9edde'%3E✳%3C/text%3E%3C/svg%3E"></head><body><a class="skip" href="#main">Skip to planner</a><div id="app"></div><dialog id="event-dialog" aria-labelledby="dialog-title"><div class="section-head"><div><p class="eyebrow">LET’S MAKE SOMETHING LOVELY</p><h2 id="dialog-title">Tell us about your event.</h2></div><button type="button" class="icon-btn" id="close-modal" aria-label="Close event form">×</button></div><p class="footnote">Creating a new plan replaces the current plan. Export it first to keep a copy. Editing event details preserves your checklist and vendors.</p><form id="event-form"><label>Event name<input name="name" required maxlength="100" placeholder="e.g. Aisha’s birthday picnic"></label><div class="form-row"><label>Celebration type<select name="type"><option>Wedding</option><option>Birthday</option><option>Community</option></select></label><label>Event date<input name="date" required type="date"></label></div><label>City or location<input name="location" required maxlength="120"></label><div class="form-row"><label>Total budget (₹)<input name="budget" required type="number" min="1000" max="100000000" step="1"></label><label>Number of guests<input name="guests" required type="number" min="1" max="100000" step="1"></label></div><label>Make it yours<textarea name="preferences" maxlength="1000" placeholder="Style, favourite things, dietary or accessibility needs…"></textarea></label><p id="form-error" class="error" role="alert" hidden></p><button class="button primary wide">Save my event plan →</button></form></dialog><script type="module" src="app.mjs"></script></body></html>
